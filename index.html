.hero h1{font-size:clamp(32px,5vw,56px);line-height:1.1;font-weight:800;max-width:560px;letter-spacing:-1px}
.hero p{margin:14px 0 26px;color:#c7d2fe;max-width:460px}
.cta{background:#fff;color:var(--pri);padding:13px 28px;border-radius:50px;font-weight:700}
.perks{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:34px}
.perks div{background:#fff;border-radius:16px;padding:16px;font-size:13px;color:var(--mut);border:1px solid var(--line)}
.perks b{display:block;color:var(--ink);font-size:14px}
.tools{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 18px;border-radius:50px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:14px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
select{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit;font-size:14px}
h2{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding-bottom:70px}
.card{background:#fff;border-radius:20px;overflow:hidden;border:1px solid var(--line);transition:.25s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-5px);box-shadow:0 20px 40px -18px #4f46e555}
.card .im{aspect-ratio:1;background:#eef0f7;position:relative;overflow:hidden}
.card img{width:100%;height:100%;object-fit:cover;transition:.4s}.card:hover img{transform:scale(1.06)}
.tag{position:absolute;top:12px;inset-inline-start:12px;background:#ef4444;color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:50px}
.card .b{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card small{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.card h3{font-size:16px;font-weight:700}
.st{color:#f59e0b;font-size:13px}.st i{font-style:normal;color:var(--mut)}
.pr{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px}
.pr b{font-size:19px}.pr s{color:var(--mut);font-size:13px;margin-inline-start:6px}
.add{background:var(--pri);color:#fff;border-radius:12px;padding:9px 14px;font-weight:700;font-size:13px}.add:hover{background:var(--pri2)}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:60px}
.ov{position:fixed;inset:0;background:#0f172a88;opacity:0;pointer-events:none;transition:.25s;z-index:40}
.ov.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(420px,100%);background:#fff;z-index:50;transform:translateX(110%);visibility:hidden;transition:transform .3s,visibility .3s;display:flex;flex-direction:column}
[dir=rtl] .drawer{transform:translateX(-110%)}
.drawer.on{transform:none!important;visibility:visible}
.dh{padding:20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);font-weight:800;font-size:18px}
.dh button{background:var(--bg);width:36px;height:36px;border-radius:50%;font-size:18px}
.items{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.it{display:flex;gap:12px;align-items:center}
.it img{width:64px;height:64px;border-radius:12px;object-fit:cover}
.it div{flex:1;font-size:14px}.it b{display:block}
.q{display:flex;align-items:center;gap:8px}.q button{width:28px;height:28px;border-radius:8px;background:var(--bg);font-weight:700}
.df{padding:20px;border-top:1px solid var(--line);display:grid;gap:8px;font-size:14px}
.df div{display:flex;justify-content:space-between}.df .tot{font-size:18px;font-weight:800}
.pay{background:linear-gradient(90deg,var(--pri),var(--pri2));color:#fff;padding:14px;border-radius:14px;font-weight:700;margin-top:6px}
.pay:disabled{opacity:.4}
.mod{position:fixed;z-index:60;inset:0;display:none;place-items:center;padding:20px}.mod.on{display:grid}
.mb{background:#fff;border-radius:24px;padding:32px;max-width:420px;width:100%;text-align:center}
.mb h3{font-size:22px;margin:10px 0}.mb p{color:var(--mut);margin-bottom:18px}
.ck{width:64px;height:64px;border-radius:50%;background:#dcfce7;color:#16a34a;display:grid;place-items:center;margin:auto;font-size:32px}
footer{background:var(--ink);color:#94a3b8;text-align:center;padding:30px;font-size:14px}
@media(max-width:980px){.grid{grid-template-columns:repeat(3,1fr)}.perks{grid-template-columns:1fr 1fr}}
@media(max-width:680px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}.hero{padding:28px;min-height:320px;border-radius:20px}
 .hd{flex-wrap:wrap;height:auto;padding:12px 0;gap:10px}.search{order:3;flex-basis:100%;max-width:none}.logo{flex:1}
 .card .b{padding:12px}.card h3{font-size:14px}.add{padding:8px 10px}.pr b{font-size:16px}.pr{flex-wrap:wrap;gap:6px}}
</style>

let lang=localStorage.nl||"en",cat="all",cart=JSON.parse(localStorage.nc||"{}");
const $=s=>document.querySelector(s),fmt=n=>n.toLocaleString(lang=="ar"?"ar-EG":"en-US");
function setText(){const t=T[lang];document.documentElement.lang=lang;document.documentElement.dir=lang=="ar"?"rtl":"ltr";
 $("#bar").textContent=t.bar;$("#lg").textContent=t.lg;$("#q").placeholder=t.search;$("#h1").textContent=t.h1;$("#hp").textContent=t.hp;$("#hc").textContent=t.hc;
 $("#perks").innerHTML=t.perks.map(p=>`<div><b>${p[0]}</b>${p[1]}</div>`).join("");$("#sh").textContent=t.sh;$("#cl").textContent=t.cart;
 $("#sort").innerHTML=t.sorts.map((s,i)=>`<option value="${i}">${s}</option>`).join("");
 $("#dt").textContent=t.dt;$("#l1").textContent=t.sub;$("#l2").textContent=t.shp;$("#l3").textContent=t.tot;$("#pay").textContent=t.pay;$("#mt").textContent=t.mt;$("#mx").textContent=t.mx}
function list(){const t=T[lang],q=$("#q").value.trim().toLowerCase(),s=+$("#sort").value;
 $("#chips").innerHTML=["all",...Object.keys(t.cats)].map(c=>`<button class="chip ${c==cat?"on":""}" data-c="${c}">${c=="all"?t.all:t.cats[c]}</button>`).join("");
 let a=P.filter(p=>(cat=="all"||p.c==cat)&&(p[lang][0]+p[lang][1]).toLowerCase().includes(q));
 if(s==1)a.sort((x,y)=>x.p-y.p);if(s==2)a.sort((x,y)=>y.p-x.p);if(s==3)a.sort((x,y)=>y.r-x.r);
 $("#grid").innerHTML=a.length?a.map(p=>`<article class="card"><div class="im">${p.o?`<span class="tag">-${Math.round(100-p.p/p.o*100)}%</span>`:""}<img src="img/${p.img}.jpg" alt="" loading="lazy"></div><div class="b"><small>${p[lang][1]}</small><h3>${p[lang][0]}</h3><div class="st">★ ${p.r} <i>(${fmt(p.n)})</i></div><div class="pr"><span><b>${fmt(p.p)} ${t.cur}</b>${p.o?`<s>${fmt(p.o)}</s>`:""}</span><button class="add" data-a="${p.id}">+ ${t.add}</button></div></div></article>`).join(""):`<div class="empty">${t.empty}</div>`}
function drawCart(){const t=T[lang];let n=0,sub=0;const ids=Object.keys(cart);
 $("#items").innerHTML=ids.length?ids.map(id=>{const p=P.find(x=>x.id==id),q=cart[id];n+=q;sub+=p.p*q;return `<div class="it"><img src="img/${p.img}.jpg" alt=""><div><b>${p[lang][0]}</b>${fmt(p.p)} ${t.cur}</div><div class="q"><button data-m="${id}">−</button><span>${q}</span><button data-pl="${id}">+</button></div></div>`}).join(""):`<p class="empty" style="padding:40px 0">${t.emptyCart}</p>`;
 const sh=sub&&sub<1500?80:0;$("#sub").textContent=fmt(sub)+" "+t.cur;$("#shp").textContent=sh?fmt(sh)+" "+t.cur:t.free;$("#tot").textContent=fmt(sub+sh)+" "+t.cur;
 $("#cn").textContent=n;$("#cn").style.display=n?"grid":"none";$("#pay").disabled=!n;localStorage.nc=JSON.stringify(cart)}
const open=v=>{$("#dr").classList.toggle("on",v);$("#ov").classList.toggle("on",v)};
document.addEventListener("click",e=>{const g=a=>e.target.closest("["+a+"]");let x;
 if(x=g("data-c")){cat=x.dataset.c;list()}
 if(x=g("data-a")){cart[x.dataset.a]=(cart[x.dataset.a]||0)+1;drawCart();open(true)}
 if(x=g("data-pl")){cart[x.dataset.pl]++;drawCart()}
 if(x=g("data-m")){if(--cart[x.dataset.m]<=0)delete cart[x.dataset.m];drawCart()}});
$("#q").oninput=list;$("#sort").onchange=list;$("#cb").onclick=()=>open(true);$("#dx").onclick=$("#ov").onclick=()=>open(false);
$("#hc").onclick=()=>$("#sh").scrollIntoView({behavior:"smooth"});
$("#lg").onclick=()=>{lang=lang=="en"?"ar":"en";localStorage.nl=lang;init()};
$("#pay").onclick=()=>{$("#mp").textContent=T[lang].mp.replace("{id}","#NV-"+Math.floor(10000+Math.random()*89999));cart={};drawCart();open(false);$("#md").classList.add("on")};
$("#mx").onclick=()=>$("#md").classList.remove("on");
function init(){setText();list();drawCart()}init();
</script>
